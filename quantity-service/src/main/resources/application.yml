server:
  port: 8081

spring:
  application:
    name: measurement-service   # MUST match gateway route: lb://measurement-service

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://dpg-d795ahffte5s739fton0-a.singapore-postgres.render.com:5432/qma_auth
    driver-class-name: org.postgresql.Driver
    username: qma_auth_user
    password: DIQrhFVI1l12oQj5amb0whAMgrThqHFU
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ── Cloud Config ────────────────────────────────────────────────────────────
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  # ── Spring Boot Admin Client ───────────────────────────────────────────────
  boot:
    admin:
      client:
        url: http://localhost:8090
        username: ${ADMIN_CLIENT_USERNAME:<ADMIN_CLIENT_USERNAME>}
        password: ${ADMIN_CLIENT_PASSWORD:<ADMIN_CLIENT_PASSWORD>}
        instance:
          name: measurement-service

# ── Eureka Client ─────────────────────────────────────────────────────────────
# FIX: fetch-registry and register-with-eureka were WRONGLY nested inside
#      service-url in the original file — they must be at the client: level.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:https://eureka-server-lsch.onrender.com/eureka/}
    fetch-registry: true          # was nested under service-url (broken)
    register-with-eureka: true    # was nested under service-url (broken)
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.quantity: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
