# ══════════════════════════════════════════════════════════════════════════════
#  application.properties – Quantity Measurement App (development profile)
#
#  IMPORTANT BEFORE GOING TO PRODUCTION:
#  1. Move sensitive values (JWT secret, OAuth2 credentials) to environment
#     variables or a secrets manager.
#  2. Replace H2 with a production-grade database (PostgreSQL / MySQL).
#  3. Set spring.jpa.hibernate.ddl-auto=validate (never 'create-drop' in prod).
#  4. Restrict management.endpoints.web.exposure.include to 'health' only.
#  5. Set spring.h2.console.enabled=false.
# ══════════════════════════════════════════════════════════════════════════════

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=quantity-measurement-app
# Uncomment to activate a specific Spring profile:
# spring.profiles.active=prod

# ── H2 In-Memory Database (dev / CI only) ────────────────────────────────────
# Replace with a real datasource in production.
#spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.datasource.url=jdbc:mysql://localhost:3306/quantity_measurement_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${APP_DB_USERNAME:<APP_DB_USERNAME>}
spring.datasource.password=${APP_DB_PASSWORD:<APP_DB_PASSWORD>}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
## 'create-drop' is only appropriate for dev/test – the schema is recreated on
## every start and dropped on shutdown.
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Web Console (dev only) ─────────────────────────────────────────────────
# Accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Restrict to localhost connections only
spring.h2.console.settings.web-allow-others=false


# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── Spring Boot Actuator ──────────────────────────────────────────────────────
# Expose only the necessary endpoints; restrict further in production.
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
# UI available at http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── JWT ───────────────────────────────────────────────────────────────────────
# SECURITY: Replace with a strong random secret (min 32 characters) in production.
# Best practice: use an environment variable → app.jwt.secret=${JWT_SECRET}
app.jwt.secret=${APP_JWT_SECRET:<APP_JWT_SECRET>}
# Token expiry: 1 day (86400000 ms)
app.jwt.expiration-ms=86400000

# ── OAuth2 – Google ───────────────────────────────────────────────────────────
# Replace with real credentials from https://console.cloud.google.com/
# SECURITY: Never commit real credentials; use environment variables in CI/CD.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:<GOOGLE_CLIENT_ID>}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:<GOOGLE_CLIENT_SECRET>}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── OAuth2 – GitHub (optional) ────────────────────────────────────────────────
# Uncomment and fill in to enable GitHub OAuth2.
# spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
# spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# spring.security.oauth2.client.registration.github.scope=user:email
# spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── OAuth2 Frontend Redirect ──────────────────────────────────────────────────
# The Angular app URL that receives the JWT after a successful OAuth2 login.
app.oauth2.redirect-uri=http://localhost:4200/dashboard
