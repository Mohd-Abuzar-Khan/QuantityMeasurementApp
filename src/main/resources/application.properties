# ──────────────────────────────────────────────────────────────────────────────
# Quantity Measurement Application - Configuration
# UC16: Database Integration with JDBC
# ──────────────────────────────────────────────────────────────────────────────

# ── Repository Type ───────────────────────────────────────────────────────────
# Values: "database" | "cache"
repository.type=database

# ── H2 Database (Development / Default) ──────────────────────────────────────
db.driver=org.h2.Driver
db.url=jdbc:h2:./quantity_measurement_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# ── H2 In-Memory (Test) ───────────────────────────────────────────────────────
# db.driver=org.h2.Driver
# db.url=jdbc:h2:mem:quantity_test_db;DB_CLOSE_DELAY=-1
# db.username=sa
# db.password=

# ── MySQL (Production - Future Use) ──────────────────────────────────────────
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/quantity_measurement?useSSL=false&serverTimezone=UTC
# db.username=root
# db.password=your_password

# ── PostgreSQL (Production - Future Use) ─────────────────────────────────────
# db.driver=org.postgresql.Driver
# db.url=jdbc:postgresql://localhost:5432/quantity_measurement
# db.username=postgres
# db.password=your_password

# ── Connection Pool Settings ──────────────────────────────────────────────────
pool.size=10
pool.timeout.ms=30000
pool.idle.timeout.ms=600000
pool.max.wait.ms=5000

# ── Schema ────────────────────────────────────────────────────────────────────
db.schema.auto=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level=INFO
logging.file=logs/quantity-measurement.log
